# Reference Tier Configuration — Standalone AI Gateway (on-prem / customer-hosted)
# ---------------------------------------------------------------
# Validates against: specs/001-api-jido-foundations/contracts/tier_config.schema.json
# Per Deliverable F / FR-013 / FR-015 / FR-050. Gateway-only shape: Runtime is
# NOT present. LLM traffic from the customer's existing agent infrastructure
# arrives via redirected OPENAI_BASE_URL (or equivalent). Receipts emit with
# tier_completeness_advisory: partial (FR-038).
#
# Identity anchor is X-Observed-Identity JWT (FR-017). Customers may either
# deploy the Recurse-shipped Standalone Identity Broker (FR-053) or bring
# their own JWT issuer — both documented in
# `specs/001-api-jido-foundations/contracts/standalone_identity_broker.md`.
#
# Out-of-band integrity hash: sibling `tier-config.sha256` file (FR-033).

tier: standalone_gateway
topology: single_node

tenant_id: "01HTENANTEXAMPLE000000000A"  # example-tenant-001

runtime:
  enabled: false      # No Runtime in Standalone Gateway shape

gateway:
  enabled: true

auth:
  anchors:
    netns: false
    observed_identity: true
  principal_provider:
    impl: "Recurse.Providers.Impls.StandaloneJwtPrincipalProvider"
    config:
      # The PrincipalProvider here maps X-Observed-Identity JWT claims
      # (sub / iss) into a canonical Principal per FR-026. Most Standalone
      # deployments resolve to principal.kind = service_account (the customer's
      # agent app acts as a service) OR principal.kind = obo_human (when the
      # SSO webhook flow supplies an id_token upstream — see the broker spec).
      default_principal_kind: service_account
  identity_broker:
    enabled: true
    listen_port: 8082
    default_audience: "https://gateway.customer-ai.example.com"
    sso_webhook_shared_secret_ref: "kms://broker/sso-webhook-secret"
    sso_webhook_path: "/sso/webhook"
    jwks_rotation_days: 90
    jti_cache_capacity: 100000
    jti_cache_ttl_seconds: 960
    jwt_lifetime_seconds: 900
    customer_idp:
      oidc_issuer: "https://customer-tenant.okta.com"
      oidc_jwks_uri: "https://customer-tenant.okta.com/.well-known/jwks.json"
    byo_jwt_issuer: false

session:
  interim_commit_event_count: 10000
  interim_commit_threshold_minutes: 60

providers:
  llm:
    impl: "Recurse.Providers.Impls.OpenAILLMProvider"
    config:
      api_base: "https://api.openai.com/v1"
      secret_ref: "vault://standalone/openai-api-key"
  ledger:
    impl: "Recurse.Providers.Impls.PostgresMerkleLedgerProvider"
    config:
      database_url: "postgres://recurse:recurse@localhost/recurse_ledger"
  storage:
    impl: "Recurse.Providers.Impls.FilesystemStorageProvider"
    config:
      root_dir: "/var/lib/recurse/payloads"
  secrets:
    impl: "Recurse.Providers.Impls.VaultSecretsProvider"
    config:
      vault_addr: "https://vault.customer-ai.example.com"
      signing_key_path: "secret/recurse/signing-key"
      signing_key_rotation_days: 90
  identity:
    # Even in Standalone Gateway, the Gateway itself holds a SPIFFE SVID for
    # authenticating to its SecretsProvider (FR-046 transport identity). The
    # SVID is NOT used for inbound machine auth — that's X-Observed-Identity.
    impl: "Recurse.Providers.Impls.SpireIdentityProvider"
    config:
      spire_server: "localhost:8081"
      trust_domain: "customer-ai.example.com"
  policy:
    impl: "Recurse.Providers.Impls.OciPolicyProvider"
    config:
      registry: "registry.recurse.ai"
      repository: "policies/standalone-gateway-example"

cedar:
  version_pin: "4.9.1"
  cedar_crate_digest: "sha256:50368b44367cd7664627bbee9bfe5721d10ab2433daf77645833645e8eb746da"

rate_limits:
  data_plane_qps_per_agent: 60
  control_plane_qps_per_tenant: 30
  max_payload_bytes: 2097152

features:

dev_mode: false
